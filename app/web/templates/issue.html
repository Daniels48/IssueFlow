        {% extends "base.html" %}   {% block content %}
        <main class="container">
        <a id="back" href="/projects/" class="back">← Back to project</a>
        <div class="page">
            <section class="content">
                <header class="issue-header">
                    <div>
                        <h1 id="title"></h1>
                        <div class="badges">
                            <span id="head_status" class="badge badge-danger"></span>
                            <span id="head_priority" class="badge badge-warning"></span>
                        </div>
                    </div>
                    <div class="actions">
                        <button id="edit-issue" class="btn btn-secondary">Edit</button>
                        <button id="issue-action"  class="btn btn-danger"></button>
                    </div>
                </header>
                <section class="card description">
                    <h2>Description</h2>
                    <p id="description"></p>
                </section>
                    <section id="comments" class="comments">
                        <div class="comments-header">
                            <h2>Comments</h2>
                            <span id="len-comments"></span>
                        </div>
                        <svg id="comment-lines"></svg>
                    </section>
                <section class="new-comment">
                    <h2>Add Comment</h2>
                        <div id="reply-info" class="hidden reply-info">
                            <div>
                                <strong>Replying to<span id="reply-author"></span></strong>
                                <p id="reply-preview"></p>
                            </div>
                            <button id="cancel-reply" type="button">✕</button>
                        </div>

                    <textarea id="text_area" rows="6" placeholder="Write your comment..."></textarea>
                    <div class="editor-footer">
                        <button class="btn btn-primary" id="post_comment">Post Comment</button>
                    </div>
                </section>
            </section>
            <aside class="sidebar">
                <section class="sidebar-card card">
                    <h3>Issue Details</h3>

                    <div class="info">
                        <div class="info-item editable" data-field="status">
                            <span>Status</span>
                            <strong id="status"></strong>
                            <span class="arrow"></span>
                        </div>
                        <div class="info-item editable" data-field="priority">
                            <span>Priority</span>
                            <strong id="priority"></strong>
                            <span class="arrow"></span>
                        </div>
                        <div class="info-item editable" data-field="due_date">
                            <span>Due Date</span>
                            <strong class="due" id="due_time"></strong>
                            <span class="arrow"></span>
                        </div>
                        <div class="info-item editable" data-field="assignee">
                            <span>Assignee</span>
                            <strong id="assignee"></strong>
                            <span class="arrow"></span>
                        </div>
                         <div class="info-item">
                            <span>Reporter</span>
                            <strong id="reporter"></strong>
                        </div>
                        <div class="info-item">
                            <span>Created</span>
                            <strong id="created_time"></strong>
                        </div>
                        <div class="info-item">
                            <span>Updated</span>
                            <strong id="updated_time"></strong>
                        </div>
                    </div>
                </section>
            </aside>
        </div>
        <div id="issue-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Edit Issue</h2>
                    <button id="modal-close" class="modal-close close-btn">&times;</button>
                </div>
                <form id="issue-form">
                    <div class="modal-body">
                            <label>Title *</label>
                            <input id="issue-title" type="text">
                            <label>Description</label>
                            <textarea id="issue-description"></textarea>
<!--                            <label>Assignee</label>-->
<!--                            <select id="issue-assignee"></select>-->
<!--                            <label>Priority</label>-->
<!--                            <select id="issue-priority">-->
<!--                                <option>low</option>-->
<!--                                <option selected>medium</option>-->
<!--                                <option>high</option>-->
<!--                                <option>critical</option>-->
<!--                            </select>-->
<!--                            <label>Status</label>-->
<!--                            <select id="issue-status">-->
<!--                                <option selected>open</option>-->
<!--                                <option>in_progress</option>-->
<!--                                <option>review</option>-->
<!--                                <option>done</option>-->
<!--                                <option>closed</option>-->
<!--                            </select>-->
<!--                            <label>Due date</label>-->
<!--                            <input type="date" id="issue-date">-->
                    </div>
                    <div class="modal-footer">
                        <button id="cancel_issue_form" class="btn-secondary">Clear</button>
                        <button id="update_btn" type="submit" class="btn-primary">Update Issue</button>
                    </div>
                </form>
            </div>
        </div>
        <div id="field-modal" class="modal hidden">
            <div class="modal-content">
                <button id="field-modal-close" type="button">&times;</button>

                <h2 id="field-modal-title"></h2>

                <div id="field-modal-body"></div>

                <div class="modal-actions">
                    <button id="field-modal-cancel">Cancel</button>
                    <button id="field-modal-save">Save</button>
                </div>
            </div>
        </div>
        </main>{% endblock %}
