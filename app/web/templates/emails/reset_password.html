<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset your password</title>
</head>

<body style="
    margin:0;
    padding:40px;
    background:#f5f7fb;
    font-family:Arial,sans-serif;
    color:#1e293b;
">

<table width="100%" cellpadding="0" cellspacing="0">
<tr>
<td align="center">

<table
    width="520"
    cellpadding="0"
    cellspacing="0"
    style="
        background:#ffffff;
        border-radius:18px;
        padding:48px;
        box-shadow:0 12px 32px rgba(0,0,0,.08);
    "
>

<tr>
<td align="center">

<div
    style="
        width:72px;
        height:72px;
        border-radius:50%;
        background:#dc2626;
        color:#ffffff;
        font-size:34px;
        line-height:72px;
        text-align:center;
        margin:0 auto 24px;
    ">
    🔒
</div>

<h1 style="
    margin:0;
    font-size:28px;
    font-weight:700;
">
    Reset your password
</h1>

<p style="
    margin:18px 0 34px;
    color:#64748b;
    font-size:16px;
    line-height:1.7;
">
    Hello <strong>{{ username }}</strong>,
    <br><br>
    We received a request to reset your password.
    Use the verification code below to continue.
</p>

<div
    style="
        display:inline-block;
        padding:18px 34px;
        background:#fef2f2;
        border:2px dashed #dc2626;
        border-radius:12px;
        font-size:38px;
        font-weight:bold;
        letter-spacing:12px;
        color:#dc2626;
        margin-bottom:30px;
    ">
    {{ code }}
</div>

<p style="
    margin:0;
    color:#64748b;
    font-size:15px;
">
    This code will expire in
    <strong>10 minutes</strong>.
</p>

<hr style="
    margin:38px 0;
    border:none;
    border-top:1px solid #e2e8f0;
">

<p style="
    margin:0;
    color:#94a3b8;
    font-size:13px;
    line-height:1.6;
">
    If you didn't request a password reset,
    you can safely ignore this email.
    Your password will remain unchanged.
</p>

</td>
</tr>

</table>

</td>
</tr>
</table>

</body>
</html>
