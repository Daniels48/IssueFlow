<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verify your email</title>
</head>

<body style="margin:0;padding:40px;background:#f5f7fb;font-family:Arial,sans-serif;color:#1e293b;">

    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
        <td align="center">

        <table width="520" cellpadding="0" cellspacing="0"
        style="background:#ffffff;border-radius:16px;padding:48px;">

        <tr>
        <td align="center">

        <div style="
        width:72px;
        height:72px;
        background:#2563eb;
        border-radius:50%;
        line-height:72px;
        font-size:34px;
        color:white;
        margin-bottom:24px;">
        ✉️
        </div>

        <h1 style="
        margin:0;
        font-size:28px;
        font-weight:700;">
        Verify your email
        </h1>

        <p style="
        margin:18px 0 32px;
        font-size:16px;
        line-height:1.7;
        color:#64748b;">
        Hello <strong>{{ username }}</strong>,
        <br><br>
        Thank you for joining IssueFlow.
        Enter the verification code below to activate your account.
        </p>

        <div style="
        font-size:42px;
        font-weight:700;
        letter-spacing:12px;
        background:#f8fafc;
        border:2px dashed #2563eb;
        padding:24px;
        border-radius:12px;
        color:#2563eb;
        margin-bottom:32px;">
        {{ code }}
        </div>

        <p style="
        font-size:15px;
        color:#64748b;
        margin:0;">
        This verification code expires in
        <strong>10 minutes</strong>.
        </p>

        <hr style="
        margin:40px 0;
        border:none;
        border-top:1px solid #e2e8f0;">

        <p style="
        font-size:13px;
        color:#94a3b8;
        line-height:1.6;
        margin:0;">
        If you didn't create an IssueFlow account,
        you can safely ignore this email.
        </p>

        </td>
        </tr>

        </table>

        </td>
        </tr>
    </table>
</body>
</html>
