        {% extends "base.html" %}   {% block content %}
        <main class="container">
            <a href="/projects" class="back">← Back to projects</a>
            <section class="project-info">
                <div class="project-header">
                    <div class="project-content">
                        <h1 id="project-title"></h1>
                        <p id="project-description"></p>
                        <div class="project-meta">
                            <span>👤 <strong id="project-owner"></strong></span>
                            <span>📅 <span id="project-created"></span></span>
                            <span>👥 <span id="members-count"></span> members</span>
                            <span>📝 <span id="issues-count"></span> issues</span>
                        </div>
                    </div>
                    <div class="project-actions">
                        <button id="edit-project">[Edit]</button>
                        <button id="manage-members">[Members]</button>
                        <button id="delete-project" class="danger">[Delete]</button>
                    </div>
                </div>
            </section>
            <section class="issues-header">
                <div style="display: flex;flex-direction: row">
                    <h2>Issues</h2>
                    <span id="count-issues">(23)</span>
                </div>
                <button id="create-issue">+ New Issue</button>
            </section>

            <section class="issue-filters">
                <input id="search_issues" class="search" type="text" placeholder="Search issues...">

                <div class="filter-row">
                    <div class="filter_one">
                        <select id="filter-status">
                            <option value="">Status</option>
                            <option value="open">Open</option>
                            <option value="in_progress">In Progress</option>
                            <option value="review">Review</option>
                            <option value="done">Done</option>
                            <option value="closed">Closed</option>
                        </select>

                        <select id="filter-priority">
                            <option value="">Priority</option>
                            <option value="critical">Critical</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>

                        <select id="filter-due-date">
                            <option value="">Due date</option>
                            <option value="overdue">Overdue</option>
                            <option value="today">Today</option>
                            <option value="upcoming">Upcoming</option>
                        </select>
                    </div>

                    <div class="filter_sort">
                        <div class="sort-row">
                            <span class="sort-title">Sort by:</span>
                            <div id="sort-list" class="sort-list"></div>
                            <div id="sort-add-container">
                                    <button id="add-sorting" class="sort-add" type="button">
                                        + Add sorting
                                    </button>
                                        <div id="sorting-menu" class="sorting-menu hidden">
                                            <button type="button" data-sort="status">Status</button>
                                            <button type="button" data-sort="priority">Priority</button>
                                            <button type="button" data-sort="due_date">Due date</button>
                                        </div>
                                </div>
                            <div class="sort-actions">
                                <button id="reset-filters" class="sort-reset" type="button">Reset</button>
                                <button id="save-filters" class="sort-save" type="button">Save</button>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

            <section class="issues" id="issues"></section>
            <div class="pages">
                <nav class="pagination" id="pagination">
                    <button class="pagination-prev" type="button">←</button>

                    <button class="pagination-page active" type="button">1</button>
                    <button class="pagination-page" type="button">2</button>
                    <button class="pagination-page" type="button">3</button>

                    <button class="pagination-next" type="button">→</button>
                </nav>
            </div>
        </main>
        <div id="members-modal" class="modal hidden">
            <div class="modal-card">
                <div class="modal-header">
                    <h2>Manage Members</h2>
                    <button id="close-btn" class="close-btn">&times;</button>
                </div>
                <div class="invite-section">
                    <h3>Invite member</h3>
                    <div class="search-wrapper">
                        <div class="search">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="7"/>
                                <path d="M20 20L17 17"/>
                            </svg>
                            <input id="user-search" type="text" placeholder="Search users..." autocomplete="off">
                        </div>
                        <div id="search-results" class="search-results hidden"></div>
                    </div>
                </div>
                <div class="member-list-container">
                    <h3 class="member-text">List Members</h3>
                   <div class="members-list" id="members-list"></div>
                </div>

            </div>
        </div>
        <div id="issue-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Create Issue</h2>
                    <button id="modal-close" class="modal-close close-btn">&times;</button>
                </div>
                <form id="issue-form">
                    <div class="modal-body">
                            <label>Title *</label>
                            <input id="issue-title" type="text">
                            <label>Description</label>
                            <textarea id="issue-description"></textarea>
                            <label>Assignee</label>
                            <select id="issue-assignee"></select>
                            <label>Priority</label>
                            <select id="issue-priority">
                                <option>low</option>
                                <option selected>medium</option>
                                <option>high</option>
                                <option>critical</option>
                            </select>
                            <label>Due date</label>
                            <input type="datetime-local" id="issue-date">

                    </div>
                    <div class="modal-footer">
                        <button id="cancel_issue_form" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary">Create Issue</button>
                    </div>
                </form>
            </div>
        </div>{% endblock %}
