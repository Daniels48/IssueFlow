        {% extends "base.html" %}{% block content %}
        <main class="container">
            <form id="reset-password-form" class="verify-box">
                <div class="verify-icon">🔒</div>
                <h1>New password</h1>
                <p class="verify-description">Create a new password for your account.</p>
                <label class="verify-label" for="password">New password</label>

                <input id="password" class="verify-input" type="password" autocomplete="new-password" minlength="8" required>

                <label class="verify-label" for="confirm-password">Confirm password</label>
                <input id="confirm-password" class="verify-input" type="password" autocomplete="new-password" minlength="8" required>

                <p id="reset-error" class="verify-error"></p>
                <button type="submit" class="verify-button">Reset password</button>
                <a class="verify-link" href="/login">Back to login</a>
            </form>
        </main>
        {% endblock %}
