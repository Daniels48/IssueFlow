    {% extends "base.html" %}    {% block content %}
    <main class="container">
        <form id="change-password-form" class="verify-box">
            <div class="verify-icon">🔒</div>
            <h1>Change password</h1>
            <p class="verify-description">Enter your current password and choose a new one.</p>
            <label class="verify-label">Current password</label>
            <input id="current-password" class="verify-input" type="password" autocomplete="current-password" required>
            <label class="verify-label">New password</label>
            <input id="new-password" class="verify-input" type="password" autocomplete="new-password" required>
            <label class="verify-label">Confirm password</label>
            <input id="confirm-password" class="verify-input" type="password" autocomplete="new-password" required>
            <button class="verify-button">Change password</button>
        </form>
    </main>
    {% endblock %}
