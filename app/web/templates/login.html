        {% extends "base.html" %}   {% block content %}
        <main class="auth">
            <div class="auth-card">
                <h1>Welcome back</h1>
                <p class="subtitle">Sign in to continue to IssueFlow</p>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username_">Username</label>
                        <input id="username_" type="text" autocomplete="username_" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input id="password" type="password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn primary">Login</button>
                </form>
                <p id="error" class="error"></p>
                <p class="footer-text">Don't have an account?<a href="/register">Register</a>
                </p>
            </div>
        </main>{% endblock %}
