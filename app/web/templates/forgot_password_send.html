        {% extends "base.html" %}{% block content %}
        <main class="container">
            <form id="forgot-password-form" class="verify-box">
                <div class="verify-icon">🔑</div>
                <h1>Forgot password</h1>
                <p class="verify-description">Enter your email address and we'll send you a verification code.</p>
                <label class="verify-label" for="email">Email</label>
                <input id="email" class="verify-input" type="email" autocomplete="email" required>
                <button class="verify-button">Send code</button>
                <a class="verify-link" href="/login">Back to login</a>
            </form>
        </main>
        {% endblock %}
