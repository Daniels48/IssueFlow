services:
  api:
    build: .
    container_name: isf_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    restart: unless-stopped

  ws:
    build: .
    container_name: isf_ws
    command: uvicorn app.workers.websocket.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: isf_redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS__PASSWORD}
    env_file:
      - .env
    ports:
      - "${REDIS__PORT}:${REDIS__PORT}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS__PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  celery:
    build: .
    container_name: isf_celery
    command: celery -A app.workers.celery.app:celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: isf_db
    environment:
      POSTGRES_DB: ${DB__NAME}
      POSTGRES_USER: ${DB__USER}
      POSTGRES_PASSWORD: ${DB__PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB__USER} -d ${DB__NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: isf_rabbit
    hostname: ${RABBIT__HOST}
    ports:
      - "${RABBIT__PORT}:${RABBIT__PORT}"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT__LOGIN}
      RABBITMQ_DEFAULT_PASS: ${RABBIT__PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "check_running"]
        interval: 10s
        timeout: 5s
        retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: isf_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - ws
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: