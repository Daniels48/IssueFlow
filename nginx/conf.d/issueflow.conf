upstream api {
    server api:8000;
}

upstream ws {
    server ws:8001;
}

server {
    listen 80;

    location /api {
        proxy_pass http://api;
    }

    location /ws {
        proxy_pass http://ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://api;
    }
}